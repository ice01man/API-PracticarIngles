<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Fondo -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a55"/>
      <stop offset="1" stop-color="#ff5e3a"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Globo de diálogo (hablar inglés) -->
  <g transform="translate(300 70)">
    <rect x="0" y="0" width="160" height="104" rx="30" fill="#ffffff"/>
    <path d="M30 96 L18 140 L66 100 Z" fill="#ffffff"/>
    <text x="80" y="72" text-anchor="middle" font-family="Nunito, Arial Rounded MT Bold, Arial, sans-serif"
          font-size="64" font-weight="900" fill="#4d7cfe">Hi!</text>
  </g>

  <!-- Búho -->
  <g transform="translate(70 150)">
    <!-- orejas -->
    <path d="M40 60 L28 0 L100 40 Z" fill="#3b4a7a"/>
    <path d="M260 60 L272 0 L200 40 Z" fill="#3b4a7a"/>
    <!-- cuerpo -->
    <path d="M150 30 C 250 30 290 100 290 180 C 290 270 230 320 150 320 C 70 320 10 270 10 180 C 10 100 50 30 150 30 Z" fill="#4d5d94"/>
    <!-- panza -->
    <ellipse cx="150" cy="240" rx="88" ry="72" fill="#f4e6c8"/>
    <path d="M110 220 q10 12 20 0 M150 220 q10 12 20 0 M130 250 q10 12 20 0 M170 250 q10 12 20 0 M115 280 q10 10 20 0 M155 280 q10 10 20 0"
          stroke="#d9c49c" stroke-width="7" fill="none" stroke-linecap="round"/>
    <!-- ojos -->
    <circle cx="100" cy="120" r="58" fill="#ffffff"/>
    <circle cx="200" cy="120" r="58" fill="#ffffff"/>
    <circle cx="108" cy="124" r="28" fill="#1f2a44"/>
    <circle cx="192" cy="124" r="28" fill="#1f2a44"/>
    <circle cx="118" cy="112" r="10" fill="#ffffff"/>
    <circle cx="202" cy="112" r="10" fill="#ffffff"/>
    <!-- pico -->
    <path d="M150 150 L132 172 L150 196 L168 172 Z" fill="#ffcf3f"/>
    <!-- birrete -->
    <g transform="translate(150 28)">
      <path d="M-92 0 L0 -40 L92 0 L0 40 Z" fill="#1f2a44"/>
      <path d="M-52 18 L-52 44 Q0 70 52 44 L52 18 L0 40 Z" fill="#1f2a44"/>
      <path d="M70 8 L70 62" stroke="#ffcf3f" stroke-width="8" stroke-linecap="round"/>
      <circle cx="70" cy="68" r="11" fill="#ffcf3f"/>
    </g>
  </g>
</svg>
